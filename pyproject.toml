[project]
name = "m365-email-hermes-plugin"
version = "0.1.0"
description = "M365 Email plugin for Hermes — send, reply, forward, read Outlook emails via Microsoft Graph API."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "python-dotenv",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib import mode keeps the suite runnable under pytest 8/9: the default
# "prepend" mode collides with conftest.py resetting sys.modules["tests"].
addopts = "--import-mode=importlib"
